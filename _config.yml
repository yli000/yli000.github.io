plugins:
  - jekyll-remote-theme

remote_theme: daviddarnes/garth

# ── Site identity ───────────────────────────────────────────────
# This shows in the top-left of every page, the browser tab, and the
# footer. Change it to whatever you want your blog to be called.
title: Yue Li
description: Notes and posts.
lang: en

# Full favicon set lives at the site root (see _layouts/default.html).
favicon: /favicon.ico

# ── Two kinds of writing ────────────────────────────────────────
# notes : quick jottings after reading something  ->  _notes/*.md
# posts : longer summaries of a topic             ->  _posts/*.md
collections:
  notes:
    output: true
    permalink: /notes/:title/
  posts:
    output: true
    permalink: /posts/:title/

defaults:
  - scope: { path: "", type: notes }
    values: { layout: post }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: pages }
    values: { layout: page }

# Keep these out of the built site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
