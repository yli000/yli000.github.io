<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		{% if page.title %}
			<title>{{ page.title }} - {{ site.title }}</title>
		{% else %}
			<title>{{ site.title }}</title>
		{% endif %}

		<meta name="description" content="{{ page.description | default: site.description }}">

		<link rel="stylesheet" href="{{ "/assets/styles.css" | relative_url }}">

		<!-- Favicons (full set lives at the site root) -->
		<link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
		<link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | relative_url }}">
		<link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">
		<link rel="manifest" href="{{ "/site.webmanifest" | relative_url }}">
		<meta name="theme-color" content="#7E9CE0">
	</head>
	<body>

		{{ content }}

		<link href="https://fonts.googleapis.com/css?family=Alegreya+Sans:400,400i,700|Neuton:400,700" rel="stylesheet">
	</body>
</html>
