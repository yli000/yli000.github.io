# Decap CMS 配置（Hugo 版）
# 打开方式：本地 http://localhost:1313/admin/  上线后 https://yli000.github.io/admin/

backend:
  name: github
  repo: yli000/yli000.github.io
  branch: main
  # OAuth 代理（Cloudflare Worker）。本机测试用不到，线上发布靠它。
  base_url: https://mybook.liiyuuee.workers.dev

# 本地免登录测试开关：
# 本机先跑 `npx decap-server`，再打开 http://localhost:1313/admin/，
# 会直接读写本地文件、不需要 GitHub 登录。它只在 localhost 生效，留着不影响线上。
local_backend: true

# 上传图片的存放位置（Hugo 的静态目录）
media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "文章"
    label_singular: "文章"
    folder: "content/blog"
    create: true
    # 文件名 = 日期 + 网址名，沿用 YYYY-MM-DD-标题.md 的习惯
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    sort:
      - { field: date, direction: descending }
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "网址名", name: "slug", widget: "string", hint: "英文小写、用连字符，如 my-first-note；决定文件名和网址" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false, hint: "可选摘要；当前列表不显示，仅作存档/SEO 备用" }
      - { label: "日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "正文", name: "body", widget: "markdown" }
